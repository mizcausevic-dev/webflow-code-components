name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bundle the library with Webflow's CLI (proves it builds the way Webflow builds it)
        run: npx webflow devlink bundle --no-input --skip-update-check
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=low
